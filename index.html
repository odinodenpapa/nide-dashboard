<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NI.DE นิเด้ Morning Brief</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f}
  .dashboard{position:fixed;inset:0;width:100%;height:100%;border:0;background:#07111f}
  .nide-brand{
    position:fixed;top:14px;left:14px;z-index:9999;
    width:150px;height:150px;object-fit:cover;border-radius:18px;
    box-shadow:0 14px 34px rgba(0,0,0,.42),0 0 28px rgba(35,216,255,.18);
    border:1px solid rgba(71,177,225,.28);
    pointer-events:none;
  }
  @media(max-width:980px){
    .nide-brand{width:92px;height:92px;top:10px;left:10px;border-radius:14px}
  }
  @media(max-width:560px){
    .nide-brand{width:72px;height:72px;top:8px;left:8px;border-radius:12px}
  }
</style>
</head>
<body>
  <iframe class="dashboard" src="dashboard.html" title="NI.DE นิเด้ Morning Brief"></iframe>
  <img class="nide-brand" src="assets/nide-logo.webp" alt="NI.DE by กองพลตาคม">
</body>
</html>
