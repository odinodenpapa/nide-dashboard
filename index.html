<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>“NI.DE” นิเด้ Morning Brief · by กองพลตาคม</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f}
#dashboardFrame{display:block;width:100%;height:100%;border:0;background:#07111f}
</style>
</head>
<body>
<iframe id="dashboardFrame" src="./dashboard.html" title="NI.DE นิเด้ Morning Brief"></iframe>
<script>
const frame=document.getElementById('dashboardFrame');
function applyNideBranding(){
  try{
    const d=frame.contentDocument;
    if(!d||!d.head||!d.body)return false;
    d.title='“NI.DE” นิเด้ Morning Brief · by กองพลตาคม';
    if(!d.getElementById('nide-branding-css')){
      const style=d.createElement('style');
      style.id='nide-branding-css';
      style.textContent=`
        .brand{display:flex!important;flex-direction:column!important;align-items:center!important;margin:0 4px 22px!important;gap:0!important}
        .nide-brand-logo{width:100%;max-width:196px;aspect-ratio:1/1;object-fit:cover;border-radius:18px;border:1px solid #1f4360;box-shadow:0 0 34px #23d8ff26,0 12px 28px #0007}
        .nide-brand-caption{margin-top:8px;color:#8fa8bf;font-size:10px;letter-spacing:.75px;text-align:center;line-height:1.35}
        .nide-title-wrap{display:flex;align-items:center;gap:12px;min-width:0}
        .nide-title-mark{width:58px;height:58px;border-radius:14px;object-fit:cover;border:1px solid #28526e;box-shadow:0 0 26px #23d8ff22;flex:0 0 auto}
        .nide-byline{margin-top:4px;color:#23d8ff;font-size:10px;font-weight:700;letter-spacing:.3px}
        @media(max-width:560px){.nide-title-mark{width:48px;height:48px}.title h1{font-size:18px!important}.nide-title-wrap{gap:9px}}
      `;
      d.head.appendChild(style);
    }
    const brand=d.querySelector('.brand');
    if(brand && !brand.dataset.nideBranded){
      brand.dataset.nideBranded='1';
      brand.innerHTML='';
      const img=d.createElement('img');
      img.className='nide-brand-logo';
      img.src='./assets/nide-logo.webp';
      img.alt='NI.DE by กองพลตาคม';
      const cap=d.createElement('div');
      cap.className='nide-brand-caption';
      cap.innerHTML='NBTC Intelligence Digital Enforcement<br><b style="color:#23d8ff">by กองพลตาคม</b>';
      brand.append(img,cap);
    }
    const topbar=d.querySelector('.topbar');
    const title=d.querySelector('.title');
    if(topbar && title && !d.querySelector('.nide-title-wrap')){
      const wrap=d.createElement('div');
      wrap.className='nide-title-wrap';
      const mark=d.createElement('img');
      mark.className='nide-title-mark';
      mark.src='./assets/nide-eagle-mark.webp';
      mark.alt='สัญลักษณ์ตานกอินทรี NI.DE';
      topbar.insertBefore(wrap,title);
      wrap.appendChild(mark);
      wrap.appendChild(title);
      if(!title.querySelector('.nide-byline')){
        const by=d.createElement('div');
        by.className='nide-byline';
        by.textContent='by กองพลตาคม';
        title.appendChild(by);
      }
    }
    const mobileFirst=d.querySelector('.mobileNav span');
    if(mobileFirst) mobileFirst.textContent='NI.DE · กองพลตาคม';
    return !!(brand && d.querySelector('.nide-title-wrap'));
  }catch(e){return false}
}
frame.addEventListener('load',()=>{
  let tries=0;
  const timer=setInterval(()=>{
    tries++;
    if(applyNideBranding()||tries>100)clearInterval(timer);
  },100);
});
</script>
</body>
</html>
